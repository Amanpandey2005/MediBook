<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(content=~{::content})}">
<head>
    <title>Feedback Management - MediBook</title>
</head>
<body>
    <div th:fragment="content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0"><i class="fas fa-envelope text-primary"></i> Feedback Management</h2>
                <a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${param.read}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> Feedback marked as read.
            </div>
            <div th:if="${param.deleted}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> Feedback deleted successfully.
            </div>
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">
                        <i class="fas fa-comments"></i> User Feedback Messages
                        <span class="badge bg-primary ms-2" th:text="${#lists.size(messages)}">0</span>
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table mb-0">
                            <thead>
                            <tr>
                                <th>Date</th>
                                <th>From</th>
                                <th>Email</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th style="width:180px;">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="m : ${messages}">
                                <td th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td th:text="${m.fullName}"></td>
                                <td th:text="${m.email}"></td>
                                <td th:text="${m.subject}"></td>
                                <td>
                                    <span class="badge" th:classappend="${m.readFlag} ? 'bg-success' : 'bg-warning'"
                                          th:text="${m.readFlag} ? 'Read' : 'Unread'"></span>
                                </td>
                                <td class="d-flex gap-1">
                                    <button class="btn btn-sm btn-outline-info" type="button" 
                                            data-bs-toggle="collapse" th:attr="data-bs-target='#msg'+${m.id}" 
                                            title="View Message">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <form th:if="${!m.readFlag}" th:action="@{'/admin/feedback/' + ${m.id} + '/read'}" method="post" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-sm btn-outline-primary" title="Mark as Read">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </form>
                                    <form th:action="@{'/admin/feedback/' + ${m.id} + '/delete'}" method="post" 
                                          onsubmit="return confirm('Delete this feedback message?');" class="d-inline">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr class="collapse bg-light" th:id="${'msg' + m.id}" th:each="m : ${messages}">
                                <td colspan="6" class="p-3">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <strong>From:</strong> <span th:text="${m.fullName}"></span><br>
                                            <strong>Email:</strong> <span th:text="${m.email}"></span><br>
                                            <strong>Date:</strong> <span th:text="${#temporals.format(m.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                        </div>
                                        <div class="col-md-6">
                                            <strong>Subject:</strong> <span th:text="${m.subject}"></span>
                                        </div>
                                    </div>
                                    <hr>
                                    <div>
                                        <strong>Message:</strong><br>
                                        <div class="mt-2 p-3 bg-white rounded border" th:text="${m.message}"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(messages)}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="fas fa-envelope fa-3x mb-3"></i><br>
                                    <h5>No feedback messages yet</h5>
                                    <p>User feedback will appear here when they contact you through the website.</p>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
