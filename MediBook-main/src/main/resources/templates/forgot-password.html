<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
<head>
    <title>Forgot Password - MediBook</title>
</head>
<body>
    <div>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card">
                        <div class="card-header text-center">
                            <h3 class="mb-0">
                                <i class="fas fa-key text-primary"></i> Forgot Password
                            </h3>
                        </div>
                        <div class="card-body p-4">
                            <div th:if="${success}" class="alert alert-success">
                                <i class="fas fa-check-circle"></i> <span th:text="${success}">Success message</span>
                            </div>
                            <div th:if="${error}" class="alert alert-danger">
                                <i class="fas fa-exclamation-circle"></i> <span th:text="${error}">Error message</span>
                            </div>
                            
                            <p class="text-muted mb-4">
                                Enter your email address and we'll send you a link to reset your password.
                            </p>
                            
                            <form th:action="@{/forgot-password}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                    </div>
                                </div>
                                
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fas fa-paper-plane"></i> Send Reset Link
                                    </button>
                                </div>
                            </form>
                            
                            <hr class="my-4">
                            
                            <div class="text-center">
                                <p class="mb-0">Remember your password?</p>
                                <a href="/login" class="btn btn-outline-primary mt-2">
                                    <i class="fas fa-sign-in-alt"></i> Back to Login
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
