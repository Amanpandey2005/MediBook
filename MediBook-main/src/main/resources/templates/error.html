<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
<head>
    <title>Error - MediBook</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div th:fragment="content">
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="mb-0 text-danger"><i class="fas fa-triangle-exclamation"></i> Something went wrong</h3>
                        </div>
                        <div class="card-body">
                            <p class="lead">We encountered an unexpected error while processing your request.</p>
                            <div class="alert alert-warning" th:if="${message}">
                                <strong>Message:</strong> <span th:text="${message}">Error message</span>
                            </div>
                            <div class="alert alert-light" th:if="${error}">
                                <strong>Status:</strong> <span th:text="${status}"></span> - <span th:text="${error}"></span>
                            </div>
                            <div class="mt-3">
                                <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Go to Home</a>
                                <a href="/login" class="btn btn-outline-primary ms-2"><i class="fas fa-sign-in-alt"></i> Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
